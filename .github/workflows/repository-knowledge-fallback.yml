name: Repository knowledge fallback

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-knowledge-fallback
  cancel-in-progress: false

jobs:
  check-latest-heads:
    name: Check latest repository heads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger authenticated production scan
        env:
          WORKBASE_CRON_URL: ${{ secrets.WORKBASE_CRON_URL }}
          WORKBASE_CRON_SECRET: ${{ secrets.WORKBASE_CRON_SECRET }}
        run: |
          test -n "$WORKBASE_CRON_URL"
          test -n "$WORKBASE_CRON_SECRET"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            --header "Authorization: Bearer $WORKBASE_CRON_SECRET" \
            "$WORKBASE_CRON_URL"
